run:
  start: "2007-01-01"          
  end:   "2025-12-31"          
# random_seed: 42

cache:
  raw_dir:       "data/raw"
  processed_dir: "data/processed"
  reports_dir:   "reports"
  plots_dir:     "plots"
  logs_dir:      "logs"

fetch:
  auto_adjust_fallback: true   # for enabling auto adjust in the yahoo api
  retry_attempts: 3
  retry_backoff_seconds: 2.0   # how much to wait between each retry, doubles so 2 then 4 then 6
  polite_delay_seconds: 0.5    # pause between each ticker download to avoid hitting api limit

clean:
  ffill_limit: 5               # bridge minor holidays/halts, importantly its always forward fill never backward fill
  min_history_days: 252        # warn if an asset has fewer usable observations

# validate:
#   outlier_sigma: 6.0           # |z-score of log return| beyond this -> flag
#   extreme_return_abs: 0.40     # |daily log return| > 40% -> flag for manual review
#   stale_run_length: 5          # >= N identical consecutive prices -> flag

stats:
  risk_free_rate: 4.0          # annualised risk-free rate for Sharpe
  trading_days_per_year: 252

plots:
  dpi: 300
  palette: "colorblind"
  vector_formats: ["pdf", "svg"]   # emitted for the 3 primary ETF figures; PNG always

universes:

  etf:
    description: "Baseline - 10 global ETFs, diversified low-correlation testbed"
    tickers: [SPY, IWM, VGK, EEM, TLT, IEF, LQD, DBC, GLD, VNQ]

  sector:
    description: "Regime-shift - 11 SPDR sector ETFs (XLRE 2015, XLC 2018 inceptions)"
    tickers: [XLE, XLF, XLK, XLV, XLY, XLP, XLI, XLB, XLU, XLRE, XLC]

