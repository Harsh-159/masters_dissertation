<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 826" width="1600" height="826">
<style>
  .bg    { fill:#FFFFFF; }
  .box   { fill:none; stroke:#999999; stroke-width:1; }
  .boxt  { font:600 15px Helvetica,Arial,sans-serif; fill:#111111; }
  .n     { stroke:#444444; stroke-width:1; fill:#F7F7F7; }
  .src   { stroke:#555555; stroke-width:1; fill:#FFFFFF; }
  .key   { stroke:#111111; stroke-width:1.5; fill:#FFFFFF; }
  .frz   { stroke:#555555; stroke-width:1; fill:#EFEFEF; stroke-dasharray:5 3; }
  .mdl   { stroke:#111111; stroke-width:2; fill:#E4E4E4; }
  .ev    { stroke:#444444; stroke-width:1; fill:#FFFFFF; }
  .t     { font:600 13px Helvetica,Arial,sans-serif; fill:#111111; text-anchor:middle; }
  .s     { font:400 10px Helvetica,Arial,sans-serif; fill:#333333; text-anchor:middle; }
  .e     { fill:none; stroke:#444444; stroke-width:1.2; marker-end:url(#a); }
  .ed    { fill:none; stroke:#444444; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#a); }
  .l     { font:400 10.5px Helvetica,Arial,sans-serif; fill:#222222; }
  .lbg   { fill:#FFFFFF; stroke:none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1600" height="826"/>

