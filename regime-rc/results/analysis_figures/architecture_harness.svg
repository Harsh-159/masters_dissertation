<text class="t" x="454" y="544">Execution Days</text><text class="s" x="454" y="562">J · weekly, lagged</text>

<!-- ═══════════ MODELS ═══════════ -->
<rect class="frz" x="718" y="350" width="264" height="120" rx="3"/>
<text class="t" x="850" y="376">Frozen Reservoir Encoder</text>
<text class="s" x="850" y="396">xₜ = (1−α)xₜ₋₁ + α tanh(Wᵢₙuₜ + Wxₜ₋₁ + b)</text>
<text class="s" x="850" y="416">ring topology · ρ exact by construction</text>
<text class="s" x="850" y="436">drawn once, never trained</text>
<text class="s" x="850" y="456">cached states · J × Nᵣ = 300</text>

<rect class="mdl" x="718" y="500" width="264" height="60" rx="3"/>
<text class="t" x="850" y="524">Proposed Portfolio Model</text>
<text class="s" x="850" y="542">experts + learned gate</text>

<rect class="ev" x="718" y="600" width="264" height="72" rx="3"/>
