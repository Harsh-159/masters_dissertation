<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 826" width="1600" height="826">
<style>
  .bg    { fill:#FFFFFF; }
  .box   { fill:none; stroke:#999999; stroke-width:1; }
  .boxt  { font:600 15px Helvetica,Arial,sans-serif; fill:#111111; }
  .src   { stroke:#555555; stroke-width:1; fill:#FFFFFF; }
  .frz   { stroke:#555555; stroke-width:1; fill:#EFEFEF; stroke-dasharray:5 3; }
  .mdl   { stroke:#111111; stroke-width:2; fill:#E4E4E4; }
  .gt    { stroke:#444444; stroke-width:1; fill:#F7F7F7; }
  .ev    { stroke:#111111; stroke-width:1.5; fill:#FFFFFF; }
  .note  { stroke:#999999; stroke-width:1; fill:#FFFFFF; stroke-dasharray:4 3; }
  .t     { font:600 13px Helvetica,Arial,sans-serif; fill:#111111; text-anchor:middle; }
  .s     { font:400 10px Helvetica,Arial,sans-serif; fill:#333333; text-anchor:middle; }
  .e     { fill:none; stroke:#444444; stroke-width:1.2; marker-end:url(#a); }
  .ed    { fill:none; stroke:#444444; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#a); }
  .en    { fill:none; stroke:#999999; stroke-width:1.2; stroke-dasharray:4 3; }
  .l     { font:400 10.5px Helvetica,Arial,sans-serif; fill:#222222; }
  .lbg   { fill:#FFFFFF; stroke:none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1600" height="826"/>

<!-- ═══════════ CONTAINERS ═══════════ -->
<rect class="box" x="20"  y="190" width="280" height="400" rx="4"/>
<text class="boxt" x="36" y="218">Inputs at signal day t</text>
<rect class="box" x="440" y="70"  width="320" height="270" rx="4"/>
<text class="boxt" x="456" y="98">Expert Heads · K = 1 is rung 1</text>
<rect class="box" x="440" y="400" width="320" height="350" rx="4"/>
<text class="boxt" x="456" y="428">Gating Network · K experts is rung 2</text>

<!-- ═══════════ LSTM VARIANT ═══════════ -->
<rect class="note" x="20" y="70" width="280" height="66" rx="3"/>
<text class="t" x="160" y="95">LSTM arm</text>
<text class="s" x="160" y="115">trained encoder replaces the frozen one</text>

<!-- ═══════════ INPUTS ═══════════ -->
<rect class="src" x="38" y="240" width="244" height="100" rx="3"/>
<text class="t" x="160" y="264">Availability Mask</text>
<text class="s" x="160" y="282">mₜ ∈ ℝ^(N+1)</text>
<text class="s" x="160" y="298">0 if tradeable, −1e9 if not</text>
<text class="s" x="160" y="314">exp(−1e9) = 0 exactly</text>
<text class="s" x="160" y="330">cash never masked</text>

<rect class="frz" x="38" y="370" width="244" height="66" rx="3"/>
<text class="t" x="160" y="394">Cached Reservoir State</text>
<text class="s" x="160" y="412">xₜ ∈ ℝ^Nᵣ</text>
<text class="s" x="160" y="428">frozen — no gradient enters here</text>

<rect class="src" x="38" y="470" width="244" height="58" rx="3"/>
<text class="t" x="160" y="494">Market Signals</text>
<text class="s" x="160" y="512">sₜ ∈ ℝ^d · d = 5</text>

<!-- ═══════════ EXPERTS ═══════════ -->
<rect class="mdl" x="458" y="125" width="284" height="84" rx="3"/>
<text class="t" x="600" y="149">Expert 1</text>
<text class="s" x="600" y="170">z⁽¹⁾ₜ = W₁xₜ + b₁ + mₜ</text>
<text class="s" x="600" y="188">w⁽¹⁾ₜ = softmax(z⁽¹⁾ₜ) ∈ Δ^N</text>

<rect class="mdl" x="458" y="231" width="284" height="84" rx="3"/>
<text class="t" x="600" y="255">Expert K</text>
<text class="s" x="600" y="276">z⁽ᴷ⁾ₜ = W_K xₜ + b_K + mₜ</text>
<text class="s" x="600" y="294">w⁽ᴷ⁾ₜ = softmax(z⁽ᴷ⁾ₜ) ∈ Δ^N</text>

<!-- ═══════════ GATE ═══════════ -->
<rect class="gt" x="458" y="452" width="284" height="68" rx="3"/>
<text class="t" x="600" y="474">Conditioning Input</text>
<text class="s" x="600" y="492">cₜ = xₜ  (rung 2)</text>
<text class="s" x="600" y="508">cₜ = xₜ ⊕ sₜ  (rung 3a)</text>

<rect class="gt" x="458" y="540" width="284" height="100" rx="3"/>
<text class="t" x="600" y="562">Logits + Train-Time Noise</text>
<text class="s" x="600" y="582">gₜ = W_g cₜ + b_g</text>
<text class="s" x="600" y="599">g̃ₜ = gₜ + σ_g(e)·ε ,  ε ~ N(0, I)</text>
<text class="s" x="600" y="616">σ_g : 0.3 → 0 by epoch</text>

<rect class="gt" x="458" y="662" width="284" height="56" rx="3"/>
<text class="t" x="600" y="684">Memberships</text>
<text class="s" x="600" y="703">πₜ = softmax(g̃ₜ / τ_g)</text>

<!-- ═══════════ BLEND ═══════════ -->
<rect class="mdl" x="840" y="330" width="290" height="78" rx="3"/>
<text class="t" x="985" y="358">Blended Portfolio</text>
<text class="s" x="985" y="382">wₜ = Σₖ πₜ,ₖ · w⁽ᵏ⁾ₜ ∈ Δ^N</text>

<!-- ═══════════ KEY IDENTITY ═══════════ -->
<rect class="note" x="840" y="470" width="290" height="112" rx="3"/>
<text class="t" x="985" y="496">∂wₜ / ∂w⁽ᵏ⁾ₜ = πₜ,ₖ</text>
<text class="s" x="985" y="518">each expert's gradient is scaled by how much</text>
<text class="s" x="985" y="534">the gate used it · routing and competence</text>
<text class="s" x="985" y="550">reinforce each other, so regimes emerge</text>
<text class="s" x="985" y="566">without anything ever being labelled</text>

<!-- ═══════════ RUNG 4 ═══════════ -->
<rect class="note" x="840" y="630" width="290" height="98" rx="3"/>
<text class="t" x="985" y="654">rung 4 — statistical gate</text>
<text class="s" x="985" y="674">πₜ supplied by HMM or VIX</text>
<text class="s" x="985" y="690">experts retrain under it</text>
<text class="s" x="985" y="706">equal capacity, equal information</text>

<!-- ═══════════ SCORING ═══════════ -->
<rect class="ev" x="1210" y="330" width="350" height="78" rx="3"/>
<text class="t" x="1385" y="356">Scoring · see diagram 1</text>
<text class="s" x="1385" y="376">differentiable ledger → net returns</text>
<text class="s" x="1385" y="392">− excess Sharpe</text>

<!-- ═══════════ RUNG 5 ═══════════ -->
<rect class="note" x="1210" y="470" width="350" height="78" rx="3"/>
<text class="t" x="1385" y="496">rung 5 — cardinality</text>
<text class="s" x="1385" y="516">keep top K_card names, renormalise</text>

<!-- ═══════════ EDGES · inputs to heads ═══════════ -->
<path class="ed" d="M300,103 H320 V128 H436"/>
<text class="l" x="306" y="97">replaces xₜ</text>

<path class="e" d="M282,290 H330 V150 H436"/>
<path class="e" d="M282,385 H355 V172 H436"/>
<path class="e" d="M282,420 H380 V496 H454"/>

<path class="ed" d="M282,486 H405 V194 H436"/>
<text class="l" x="288" y="478">rung 3b</text>
<path class="ed" d="M282,512 H452"/>
<text class="l" x="288" y="530">rung 3a</text>

<!-- ═══════════ EDGES · inside the gate ═══════════ -->
<path class="e" d="M600,520 V538"/>
<path class="e" d="M600,640 V660"/>

<!-- ═══════════ EDGES · heads to blend ═══════════ -->
<path class="e" d="M742,167 H800 V348 H836"/>
<path class="e" d="M742,273 H778 V364 H836"/>
<path class="e" d="M742,690 H790 V380 H836"/>
<rect class="lbg" x="796" y="546" width="70" height="15"/>
<text class="l" x="800" y="557">πₜ · J × K</text>

<path class="ed" d="M840,679 H814 V396 H836"/>
<text class="l" x="844" y="620">replaces the learned π</text>

<path class="en" d="M985,408 V468"/>

<!-- ═══════════ EDGES · blend to scoring ═══════════ -->
<path class="e"  d="M1130,352 H1208"/>
<text class="l" x="1136" y="344">wₜ · J × N+1</text>
<path class="ed" d="M1210,386 H1132"/>
<text class="l" x="1136" y="378">gradient</text>

<path class="ed" d="M1130,400 H1170 V496 H1208"/>
<rect class="lbg" x="1174" y="432" width="42" height="15"/>
<text class="l" x="1178" y="443">rung 5</text>
<path class="ed" d="M1385,470 V410"/>
</svg>
